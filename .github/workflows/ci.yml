name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji:
    name: Tipe · lint · regresi · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: produksia
          POSTGRES_PASSWORD: produksia
          POSTGRES_DB: produksia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U produksia -d produksia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://produksia:produksia@localhost:5432/produksia_ci
      # Skrip regresi memanggil aksi server di luar HTTP (lihat penggunaSaatIni di src/lib/otentikasi.ts)
      UJI_TANPA_SESI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Migrasi & generate Prisma
        run: |
          npx prisma migrate deploy --config prisma7.config.ts
          npx prisma generate --config prisma7.config.ts

      - name: Pemeriksaan tipe
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint

      - name: Data contoh
        run: npx tsx prisma/seed.ts

      - name: Regresi (semua skrip/uji-*.ts + pemeriksaan sinkron)
        # Daftar skrip TIDAK di-hardcode di sini, supaya skrip uji baru otomatis ikut
        # dijalankan tanpa perlu mengedit workflow ini (lihat "uji" di package.json).
        run: npm run uji

      - name: Build produksi
        run: npx next build
