name: Deploy

# Terpicu otomatis setelah workflow CI di cabang main sukses, atau manual lewat tombol "Run workflow",
# TAPI job-nya menunggu persetujuan manual dulu (environment "produksi", lihat di bawah) sebelum
# benar-benar menyentuh server. Kelola/hapus reviewer di Settings → Environments → produksi.
# Rahasia yang dibutuhkan (Settings → Secrets and variables → Actions):
#   VPS_HOST     : alamat IP / nama host server
#   VPS_SSH_KEY  : kunci privat OpenSSH (ed25519) yang kunci publiknya ada di /srv/produksia/.ssh/authorized_keys
#   VPS_SSH_PORT : opsional, bawaan 22
# Variabel opsional (Settings → Secrets and variables → Actions → Variables):
#   VPS_USER   : pengguna SSH, bawaan `produksia` (server Docker/Coolify: `root`)
#   DEPLOY_CMD : perintah di server, bawaan `bash /srv/produksia/app/deploy/deploy.sh`
#                (server Docker/Coolify: `bash /data/produksia/app/deploy/docker/deploy.sh`)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produksi
  cancel-in-progress: false

jobs:
  deploy:
    name: Perbarui server
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gerbang persetujuan manual: environment "produksi" (Settings → Environments) mewajibkan
    # reviewer menyetujui run ini sebelum job benar-benar jalan, walau CI sukses otomatis
    # memicu workflow ini. Kelola daftar reviewer di Settings → Environments → produksi.
    environment: produksi
    steps:
      - name: Siapkan kunci SSH
        env:
          KUNCI: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Jalankan deploy.sh di server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          PENGGUNA: ${{ vars.VPS_USER }}
          PERINTAH: ${{ vars.DEPLOY_CMD }}
        run: ssh -i ~/.ssh/id_ed25519 -p "${PORT:-22}" "${PENGGUNA:-produksia}@$HOST" "${PERINTAH:-bash /srv/produksia/app/deploy/deploy.sh}"
