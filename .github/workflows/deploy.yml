name: Deploy

# Berjalan otomatis setelah workflow CI di cabang main sukses, atau manual lewat tombol "Run workflow".
# Rahasia yang dibutuhkan (Settings → Secrets and variables → Actions):
#   VPS_HOST     : alamat IP / nama host server
#   VPS_SSH_KEY  : kunci privat OpenSSH (ed25519) yang kunci publiknya ada di /srv/produksia/.ssh/authorized_keys
#   VPS_SSH_PORT : opsional, bawaan 22
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produksi
  cancel-in-progress: false

jobs:
  deploy:
    name: Perbarui server
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Siapkan kunci SSH
        env:
          KUNCI: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Jalankan deploy.sh di server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: ssh -i ~/.ssh/id_ed25519 -p "${PORT:-22}" "produksia@$HOST" 'bash /srv/produksia/app/deploy/deploy.sh'
