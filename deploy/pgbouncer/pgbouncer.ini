; PgBouncer di depan PostgreSQL Produksia (dipakai Vercel / klien luar). Disalin ke /data/produksia/pgbouncer oleh
; deploy/docker/pasang-pgbouncer.sh bersama userlist.txt dan sertifikat TLS.
[databases]
; aplikasi: pool mode transaksi (hemat koneksi untuk serverless)
produksia = host=db port=5432 dbname=produksia
; migrasi Prisma: mode session (advisory lock & banyak pernyataan dalam satu koneksi)
produksia_migrasi = host=db port=5432 dbname=produksia pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = produksia
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits,options
; TLS wajib untuk klien (Vercel di internet); ke PostgreSQL di jaringan docker internal tanpa TLS
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_protocols = tlsv1.2,tlsv1.3
server_tls_sslmode = disable
log_connections = 0
log_disconnections = 0
stats_period = 300
