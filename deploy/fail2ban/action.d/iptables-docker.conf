# Ban masuk rantai DOCKER-USER: trafik ke port yang dipublikasikan kontainer tidak lewat INPUT,
# jadi action fail2ban bawaan (INPUT) tidak akan memblokirnya.
[Definition]
actionban = iptables -C DOCKER-USER -s <ip> -j DROP 2>/dev/null || iptables -I DOCKER-USER -s <ip> -j DROP
actionunban = iptables -D DOCKER-USER -s <ip> -j DROP 2>/dev/null; true
